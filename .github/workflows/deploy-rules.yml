name: Déployer les règles Firebase
on:
  push:
    branches: [main]
    paths: [firestore.rules, storage.rules, firebase.json, .github/workflows/deploy-rules.yml]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Déployer firestore.rules et storage.rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Secret FIREBASE_SERVICE_ACCOUNT absent (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          PROJECT=$(node -e "console.log(require(process.env.GOOGLE_APPLICATION_CREDENTIALS).project_id)")
          npx -y firebase-tools@13 deploy --only firestore:rules,storage --project "$PROJECT" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
